[project]
name = "hackshop-sim"
version = "0.1.0"
description = "HackShop simulation worker: turns an Assembly IR into a runnable MuJoCo scene, simulates the assembled robot navigating a world, and renders watchable mp4 + trajectory artifacts."
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.1",
    "imageio[ffmpeg]>=2.34",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
agent = ["anthropic>=0.39"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hackshop_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
