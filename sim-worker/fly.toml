# Fly.io config for the HackShop sim-worker.
#
# Deploy:
#   cd sim-worker
#   fly launch --no-deploy        # first time only; accept this app name
#   fly deploy
#   fly status                    # grab the https URL, e.g. https://hackshop-sim.fly.dev
#
# Then point the site at it (in the Vercel project, NOT here):
#   npx vercel env add SIM_WORKER_URL production    # -> https://hackshop-sim.fly.dev
# and set the worker's own public base so artifact links are absolute + public:
#   fly secrets set PUBLIC_BASE_URL=https://hackshop-sim.fly.dev

app = "hackshop-sim"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  MUJOCO_GL = "osmesa"
  PYOPENGL_PLATFORM = "osmesa"
  HACKSHOP_RUNS_DIR = "/app/runs"

# Artifacts (videos, summaries, renders) are written to /app/runs. Without a
# persistent volume they live in the ephemeral container fs and vanish on every
# machine stop/restart -> /artifacts/... returns 404. The volume keeps them.
#
# IMPORTANT: a Fly volume is bound to ONE machine. Run exactly one machine for
# this app (`fly scale count 1`), otherwise a request can land on a machine that
# doesn't have the artifact. For multi-machine scale-out, move artifacts to
# object storage (Tigris/S3) instead of a volume.
[mounts]
  source = "runs"
  destination = "/app/runs"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine warm so the first request doesn't pay a ~7.6s cold start
  # (MuJoCo + OSMesa import). Staying up also means far fewer restarts, so the
  # in-process job dict survives most of the time (jobs.py reconstructs from disk
  # for the rest). auto_start still recovers from a crash. The single warm
  # machine keeps the volume single-tenant (one machine binds the volume).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

# MuJoCo rollouts + offscreen OSMesa render are CPU/RAM hungry. 1GB is the floor
# for the studio renders; bump to 2GB if you see OOM on bigger assemblies.
[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
