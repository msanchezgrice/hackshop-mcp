# Fly.io config for the HackShop sim-worker.
#
# Deploy:
#   cd sim-worker
#   fly launch --no-deploy        # first time only; accept this app name
#   fly deploy
#   fly status                    # grab the https URL, e.g. https://hackshop-sim.fly.dev
#
# Then point the site at it (in the Vercel project, NOT here):
#   npx vercel env add SIM_WORKER_URL production    # -> https://hackshop-sim.fly.dev
# and set the worker's own public base so artifact links are absolute + public:
#   fly secrets set PUBLIC_BASE_URL=https://hackshop-sim.fly.dev

app = "hackshop-sim"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  MUJOCO_GL = "osmesa"
  PYOPENGL_PLATFORM = "osmesa"
  HACKSHOP_RUNS_DIR = "/app/runs"

[http_service]
  internal_port = 8000
  force_https = true
  # Scale to zero between demos to keep cost ~$0; first request pays a cold start.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

# MuJoCo rollouts + offscreen OSMesa render are CPU/RAM hungry. 1GB is the floor
# for the studio renders; bump to 2GB if you see OOM on bigger assemblies.
[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
