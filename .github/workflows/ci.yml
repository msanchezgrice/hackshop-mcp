name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Validate catalog and tags (boot-time gate)
        run: npm run validate

      - name: Run unit tests
        run: npm test

      - name: TypeScript build
        run: npm run build

      - name: Run regression suite (catalog/example consistency only)
        run: npm run regress
